<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedGuide</title>
  <link rel="stylesheet" href="/static/medical_rag.css">
  <script src="/static/medical_rag.js" defer></script>
</head>

<body>
  <main class="app">
    <header>
      <div>
        <!-- <h1>ITC profile-guide</h1> -->
        <p>Explore clinic, treatment, FAQ and reviews information from ITC’s PlacidWay profile.</p>
      </div>
    </header>

    <section id="messages" aria-live="polite">
      <div id="welcome" class="welcome">
        <h2>How can we help you explore ITC?</h2>
        <form id="chat-form">
          <input id="question" placeholder="Ask a question..." autocomplete="off" required>
          <button id="send" aria-label="Send message">↑</button>
        </form>
      </div>
    </section>

    <footer>Answers are based on the source profile and are not medical advice.</footer>
  </main>

</body>
</html>
