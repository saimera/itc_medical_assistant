<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedGuide</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: #243330;
      background: #fbfcfb;
      font: 16px Arial, sans-serif;
    }

    .app {
      height: 100dvh;
      padding: 28px 40px 18px;
      display: flex;
      flex-direction: column;
    }

    header { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 38px; height: 38px;
      display: grid; place-items: center;
      border-radius: 12px;
      color: white; background: #218779;
      font-size: 23px;
    }

    h1 { margin: 0; font-size: 19px; }
    header p, footer { color: #788783; font-size: 13px; }
    header p { margin: 5px 0 0; }

    #messages {
      width: min(760px, 100%);
      flex: 1; min-height: 0;
      align-self: center;
      display: flex; flex-direction: column;
      justify-content: center;
      overflow-y: auto;
      padding: 24px 0;
    }

    .app.chat-started #messages { justify-content: flex-start; }

    .welcome {
      margin: 0;
      color: #60736e;
      text-align: center;
    }

    .welcome h2 { margin-top:-70px ; margin-bottom: 8px; font-size: 27px; }
    .welcome p { font-size: 15px; }
    .welcome form { margin-top: 25px; }

    .message {
      max-width: 82%;
      margin: 10px 0;
      padding: 13px 16px;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      align-self: flex-end;
      color: #20312f;
      background: #eaf3f0;
    }

    .assistant { align-self: flex-start; }

    .sources { margin-top: 10px; font-size: 13px; }
    .sources a {
      display: block;
      margin-top: 5px;
      color: #167568;
      overflow-wrap: anywhere;
    }

    form {
      width: min(700px, 100%);
      align-self: center;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1; min-width: 0;
      padding: 15px;
      border: 1px solid #dce5e2;
      border-radius: 14px;
      background: white;
      font-size: 15px;
      outline-color: #218779;
    }

    button {
      width: 48px;
      border: 0;
      border-radius: 14px;
      color: white;
      background: #218779;
      font-size: 22px;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }
    footer { padding-top: 12px; text-align: center; }

    @media (max-width: 600px) {
      .app { padding: 20px 16px 14px; }
      .welcome h2 { font-size: 23px; }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div>
        <h1>ITC Profile Guide</h1>
        <p>Explore clinic, treatment, FAQ, and review information from ITC’s PlacidWay profile.</p>
      </div>
    </header>

    <section id="messages" aria-live="polite">
      <div id="welcome" class="welcome">
        <h2>How can I help?</h2>
        <form id="chat-form">
          <input id="question" placeholder="Ask a question..." autocomplete="off" required>
          <button id="send" aria-label="Send message">↑</button>
        </form>
      </div>
    </section>

    <footer>Answers are based on the source profile and are not medical advice.</footer>
  </main>

  <script>

    const app = document.querySelector(".app");
    const footer = document.querySelector("footer");
    const welcome = document.querySelector("#welcome");
    const form = document.querySelector("#chat-form");
    const input = document.querySelector("#question");
    const send = document.querySelector("#send");
    const messages = document.querySelector("#messages");

    function addMessage(text, role) {
      const bubble = document.createElement("div");
      bubble.className = `message ${role}`;
      bubble.textContent = text;
      messages.appendChild(bubble);
      messages.scrollTop = messages.scrollHeight;
      return bubble;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question) return;
      if (!app.classList.contains("chat-started")) {
      app.classList.add("chat-started");
      footer.before(form);
      welcome.remove();
    }

      addMessage(question, "user");
      input.value = "";
      send.disabled = true;

      const reply = addMessage("Searching the profile…", "assistant");

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });

        if (!response.ok) throw new Error();
        const data = await response.json();

        reply.textContent = (data.answer || "No answer returned.")
          .replace(/\s*Source:\s*https?:\/\/\S+/gi, "")
          .trim();

        if (data.sources?.length) {
          const sourceBox = document.createElement("div");
          sourceBox.className = "sources";
          sourceBox.textContent = "Sources:";

          data.sources.forEach((url) => {
            const link = document.createElement("a");
            link.href = url;
            link.textContent = url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            sourceBox.appendChild(link);
          });

          reply.appendChild(sourceBox);
        }
      } catch {
        reply.textContent = "Could not get a response. Check that the backend is running.";
      } finally {
        send.disabled = false;
        input.focus();
        messages.scrollTop = messages.scrollHeight;
      }
    });
  </script>
</body>
</html>
